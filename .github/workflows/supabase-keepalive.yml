# Supabase pauses free-tier projects after 7 days without activity. This ping
# keeps the project awake. Add SUPABASE_URL and SUPABASE_ANON_KEY as repository
# secrets (Settings -> Secrets and variables -> Actions).
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping REST endpoint
        run: |
          curl -sSf "$SUPABASE_URL/rest/v1/gotras?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" > /dev/null
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
