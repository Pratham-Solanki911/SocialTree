# Builds the Flutter web app and publishes it to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions";
# Settings -> Secrets and variables -> Actions -> add SUPABASE_URL and SUPABASE_ANON_KEY.
# The site is served at https://<owner>.github.io/<repo>/
name: Deploy web
on:
  push:
    branches: [main, claude/fervent-wozniak-mfafkt]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Build
        run: |
          flutter build web --release --no-web-resources-cdn \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          # GitHub Pages has no SPA fallback; serving index.html as 404 lets
          # deep links like /persons/<id> load the app, which then routes.
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
