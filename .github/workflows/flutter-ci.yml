name: Flutter CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=SUPABASE_URL=https://example.supabase.co --dart-define=SUPABASE_ANON_KEY=ci
  sql-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run migration + smoke test
        env:
          PGPASSWORD: postgres
        run: |
          psql="psql -v ON_ERROR_STOP=1 -q -h localhost -U postgres -d postgres"
          $psql -f supabase/tests/stubs.sql
          for f in supabase/migrations/*.sql; do $psql -f "$f"; done
          $psql -f supabase/tests/grants.sql
          $psql -f supabase/tests/smoke.sql
