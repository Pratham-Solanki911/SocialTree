# Minimal Supabase CLI config. `supabase link --project-ref dcrggwdfanqmbyjanbaq` then `supabase db push`.
project_id = "socialtree"

[db]
major_version = 17

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["in.samaj.socialtree://login-callback"]

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
