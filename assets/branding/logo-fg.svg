<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- SocialTree mark v2: a banyan-like tree whose canopy holds a small family
       graph, standing on spreading roots. Terracotta trunk (brand seed 8B4513
       family), two-tone green canopy, cream badge. Reads at 24 px as a tree
       on a base; at 512 px the family nodes are visible. -->
  <defs>
    <linearGradient id="canopy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7BBE63"/>
      <stop offset="1" stop-color="#3F8A3D"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8EE"/>
      <stop offset="1" stop-color="#F6E7D0"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A3E14"/>
      <stop offset="0.5" stop-color="#9C5426"/>
      <stop offset="1" stop-color="#7A3E14"/>
    </linearGradient>
  </defs>
  <!-- ground -->
  <ellipse cx="256" cy="418" rx="150" ry="14" fill="#D9A441" opacity="0.35"/>
  <!-- roots -->
  <g fill="none" stroke="url(#wood)" stroke-width="14" stroke-linecap="round">
    <path d="M256 372 C 240 392, 200 396, 150 420"/>
    <path d="M256 372 C 272 392, 312 396, 362 420"/>
    <path d="M250 376 C 236 400, 214 408, 196 428"/>
    <path d="M262 376 C 276 400, 298 408, 316 428"/>
    <path d="M256 378 L 256 430"/>
  </g>
  <!-- trunk -->
  <path d="M234 246 C 240 300, 236 340, 220 384 L 292 384 C 276 340, 272 300, 278 246 Z" fill="url(#wood)"/>
  <!-- canopy -->
  <g fill="url(#canopy)">
    <circle cx="256" cy="150" r="92"/>
    <circle cx="178" cy="206" r="74"/>
    <circle cx="334" cy="206" r="74"/>
    <circle cx="206" cy="262" r="60"/>
    <circle cx="306" cy="262" r="60"/>
    <circle cx="256" cy="240" r="68"/>
  </g>
  <!-- soft light on the crown -->
  <path d="M196 118 C 214 88, 262 74, 300 92 C 268 94, 230 108, 206 140 Z" fill="#FFFFFF" opacity="0.22"/>
  <!-- family graph inside the canopy -->
  <g stroke="#FFF8EE" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M256 150 L 206 200"/>
    <path d="M256 150 L 306 200"/>
    <path d="M206 200 L 180 250"/>
    <path d="M206 200 L 232 250"/>
    <path d="M306 200 L 280 250"/>
    <path d="M306 200 L 332 250"/>
  </g>
  <g fill="#FFF8EE">
    <circle cx="256" cy="150" r="15"/>
    <circle cx="206" cy="200" r="12"/>
    <circle cx="306" cy="200" r="12"/>
    <circle cx="180" cy="250" r="9"/>
    <circle cx="232" cy="250" r="9"/>
    <circle cx="280" cy="250" r="9"/>
    <circle cx="332" cy="250" r="9"/>
  </g>
  <circle cx="256" cy="150" r="7" fill="#D9A441"/>
</svg>
